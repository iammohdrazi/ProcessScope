[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "processscope"
version = "0.1.7"
description = "Linux Process Observability Platform — Attach, inspect, and analyze any running Linux process in real time."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "ProcessScope Team", email = "team@processscope.dev"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Debuggers",
]
keywords = ["linux", "process", "observability", "monitoring", "telemetry", "debugging", "profiling"]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "psutil>=5.9.8",
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "aiosqlite>=0.20.0",
    "python-json-logger>=2.0.7",
    "pyelftools>=0.31",
    "aiofiles>=24.1.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.4.0",
]
ebpf = [
    "bcc>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/processscope/processscope"
Documentation = "https://processscope.dev/docs"
Repository = "https://github.com/processscope/processscope"
Issues = "https://github.com/processscope/processscope/issues"

[project.scripts]
processscope = "processscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
processscope = [
    "dashboard/**/*",
    "py.typed",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
