# ProcessScope — rsyslog Configuration
# Install to: /etc/rsyslog.d/50-processscope.conf
#
# Forwards ProcessScope logs to /var/log/messages (or syslog)
# This ensures ProcessScope appears in standard Linux system log locations.

:programname, isequal, "processscope" /var/log/messages
:programname, isequal, "processscope" ~
