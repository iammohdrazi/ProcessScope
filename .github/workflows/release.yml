name: ProcessScope Release Build

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'
      create_release:
        description: 'Create GitHub release after successful tests'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  APP_NAME: processscope
  PYTHON_VERSION: '3.11'

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Job 1: Version Management
  # ────────────────────────────────────────────────────────────────────
  version-bump:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version_bump.outputs.new_version }}
      old_version: ${{ steps.version_bump.outputs.old_version }}
      is_release: ${{ steps.version_bump.outputs.is_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install toml

      - name: Bump version
        id: version_bump
        run: |
          python scripts/bump_version.py --type ${{ inputs.version_type }}
          echo "new_version=$(python scripts/get_version.py)" >> $GITHUB_OUTPUT
          echo "old_version=$(git show HEAD:pyproject.toml | grep '^version =' | head -1 | cut -d'"' -f2)" >> $GITHUB_OUTPUT
          echo "is_release=${{ inputs.create_release }}" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pyproject.toml dist/install.sh README.md
          git commit -m "chore: bump version to ${{ steps.version_bump.outputs.new_version }}"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
        continue-on-error: false

  # ────────────────────────────────────────────────────────────────────
  # Job 2: Build Release Package
  # ────────────────────────────────────────────────────────────────────
  build:
    needs: version-bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.version-bump.outputs.new_version }}
      build_number: ${{ steps.build_info.outputs.build_number }}
      package_name: ${{ steps.build_info.outputs.package_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-venv

      - name: Generate build info
        id: build_info
        run: |
          BUILD_NUMBER=$(date -u +"%Y%m%d.%H%M%S").$(git rev-parse --short HEAD)
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          PACKAGE_NAME="${{ env.APP_NAME }}-${{ needs.version-bump.outputs.new_version }}-linux-x86_64.tar.gz"
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

      - name: Build packages
        run: |
          make clean
          make build
          make package-tar
        env:
          VERSION: ${{ needs.version-bump.outputs.new_version }}
          BUILD_TYPE: release

      - name: Verify package was created
        run: |
          echo "=== Built packages ==="
          ls -lh dist/output/
          PACKAGE=$(find dist/output -name "*.tar.gz" -type f | head -n 1)
          if [ -z "$PACKAGE" ]; then
            echo "ERROR: No .tar.gz package found in dist/output/"
            exit 1
          fi
          echo "Package ready: $PACKAGE"
          echo "Size: $(du -sh $PACKAGE | cut -f1)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/output/*.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Upload test script
        uses: actions/upload-artifact@v4
        with:
          name: test-scripts
          path: scripts/test_install.sh
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────
  # Job 3: Multi-Distribution Installation Testing
  # ────────────────────────────────────────────────────────────────────
  test-install:
    needs: [version-bump, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: ubuntu-22.04
            image: ubuntu:22.04
            pkg_manager: apt
            install_cmd: >
              apt-get update &&
              apt-get install -y python3.11 python3.11-venv python3-pip --no-install-recommends &&
              update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          - name: ubuntu-24.04
            image: ubuntu:24.04
            pkg_manager: apt
            install_cmd: >
              apt-get update &&
              apt-get install -y python3.12 python3.12-venv python3-pip --no-install-recommends &&
              update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.12 1
          - name: debian-12
            image: debian:12
            pkg_manager: apt
            install_cmd: >
              apt-get update &&
              apt-get install -y python3.11 python3.11-venv python3-pip --no-install-recommends &&
              update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          - name: fedora-39
            image: fedora:39
            pkg_manager: dnf
            install_cmd: >
              dnf install -y python3.11 python3.11-pip --setopt=install_weak_deps=False &&
              alternatives --set python3 /usr/bin/python3.11

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-packages/

      - name: List downloaded files
        run: |
          echo "=== Downloaded release package ==="
          find release-packages/ -type f | sort
          ls -lh release-packages/

      - name: Start test container
        run: |
          docker run -d --name test-container ${{ matrix.distro.image }} sleep infinity
          sleep 3

      - name: Install Python in container
        run: |
          for attempt in 1 2 3; do
            if docker exec test-container bash -c "${{ matrix.distro.install_cmd }}"; then
              echo "Dependencies installed on attempt $attempt"
              break
            fi
            echo "Attempt $attempt failed, retrying in 5s..."
            sleep 5
          done

          # Ensure python3-venv is available for apt systems
          if [ "${{ matrix.distro.pkg_manager }}" = "apt" ]; then
            docker exec test-container bash -c "apt-get install -y python3-venv 2>/dev/null || true"
          fi

      - name: Copy and extract package
        run: |
          PACKAGE=$(find release-packages/ -name "*.tar.gz" -type f | head -n 1)
          if [ -z "$PACKAGE" ]; then
            echo "ERROR: No .tar.gz found in release-packages/"
            exit 1
          fi
          echo "Testing with package: $PACKAGE"
          docker cp "$PACKAGE" test-container:/tmp/processscope.tar.gz
          docker exec test-container bash -c "cd /tmp && tar -xzf processscope.tar.gz && ls -la"

      - name: Run installer
        run: |
          docker exec test-container bash -c "
            INSTALL_DIR=\$(find /tmp -name 'processscope-*' -type d | head -n 1)
            echo \"Installing from: \$INSTALL_DIR\"
            cd \"\$INSTALL_DIR\"
            SKIP_SYSTEMD=true ./install.sh
          "

      - name: Verify installation
        run: |
          echo "=== Checking processscope binary ==="
          docker exec test-container bash -c "which processscope && processscope --version || processscope version || true"
          echo "=== Checking install paths ==="
          docker exec test-container bash -c "ls -la /opt/processscope/ || true"
          docker exec test-container bash -c "ls -la /usr/local/bin/processscope || true"

      - name: Test uninstall
        run: |
          case "${{ matrix.distro.pkg_manager }}" in
            apt)
              docker exec test-container bash -c "apt-get remove -y processscope 2>/dev/null || rm -rf /opt/processscope /etc/processscope /usr/local/bin/processscope"
              ;;
            dnf)
              docker exec test-container bash -c "dnf remove -y processscope 2>/dev/null || rm -rf /opt/processscope /etc/processscope /usr/local/bin/processscope"
              ;;
            *)
              docker exec test-container bash -c "rm -rf /opt/processscope /etc/processscope /usr/local/bin/processscope"
              ;;
          esac

      - name: Verify cleanup
        run: |
          docker exec test-container bash -c "! which processscope 2>/dev/null || true"
          docker exec test-container bash -c "[ ! -d /opt/processscope ] && echo 'Cleanup OK' || echo 'WARNING: /opt/processscope still exists'"

      - name: Cleanup container
        if: always()
        run: docker rm -f test-container || true

      - name: Report result
        if: always()
        run: echo "✅ Test completed for ${{ matrix.distro.name }}"

  # ────────────────────────────────────────────────────────────────────
  # Job 4: Create GitHub Release (only after all tests pass)
  # ────────────────────────────────────────────────────────────────────
  create-release:
    needs: [version-bump, build, test-install]
    if: ${{ needs.version-bump.outputs.is_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-packages/

      - name: Verify release package
        run: |
          echo "=== Release package contents ==="
          ls -lh release-packages/
          PACKAGE=$(find release-packages/ -name "*.tar.gz" | head -n 1)
          if [ -z "$PACKAGE" ]; then
            echo "ERROR: No .tar.gz package found!"
            exit 1
          fi
          echo "Will attach to release: $PACKAGE"
          # Move to workspace root for easy glob
          cp "$PACKAGE" .
          ls -lh *.tar.gz

      - name: Generate release notes
        run: |
          VERSION="${{ needs.version-bump.outputs.new_version }}"
          BUILD="${{ needs.build.outputs.build_number }}"
          PACKAGE="${{ needs.build.outputs.package_name }}"

          cat > release_notes.md << EOF
          # ProcessScope v${VERSION}

          ## Changes
          - Automated release build
          - Build number: ${BUILD}
          - Build type: release

          ## Installation

          ### Quick Install (tar.gz)
          \`\`\`bash
          # Download the package below
          tar -xzf processscope-${VERSION}-linux-x86_64.tar.gz
          cd processscope-${VERSION}
          sudo ./install.sh
          \`\`\`

          After installation:
          \`\`\`bash
          # Start the service
          sudo systemctl start processscope
          sudo systemctl enable processscope

          # Check status
          processscope status

          # View logs
          journalctl -u processscope -f
          \`\`\`

          ## Tested Distributions
          - ✅ Ubuntu 22.04 & 24.04
          - ✅ Debian 12
          - ✅ Fedora 39

          All installation and uninstallation tests passed in container mode.

          > **Note**: For complete systemd integration testing, install on actual VMs or bare metal.
          EOF

      - name: Create GitHub Release with package asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-bump.outputs.new_version }}
          name: ProcessScope v${{ needs.version-bump.outputs.new_version }}
          body_path: release_notes.md
          files: "*.tar.gz"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post release summary
        run: |
          VERSION="${{ needs.version-bump.outputs.new_version }}"
          PACKAGE=$(find . -maxdepth 1 -name "*.tar.gz" | head -n 1 | xargs basename)

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🎉 Release v${VERSION} Created Successfully!

          | Field | Value |
          |:------|:------|
          | Version | ${VERSION} |
          | Build | ${{ needs.build.outputs.build_number }} |
          | Tag | v${VERSION} |
          | Package | \`${PACKAGE}\` |

          ### ✅ Tested Distributions
          - Ubuntu 22.04 & 24.04
          - Debian 12
          - Fedora 39

          ### Install
          \`\`\`bash
          tar -xzf ${PACKAGE}
          cd processscope-${VERSION}
          sudo ./install.sh
          \`\`\`
          EOF
